[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "r-elegans"
version = "0.1.0"
description = "Differentiable, connectome-constrained C. elegans simulation in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "r-elegans Contributors" }]
dependencies = [
  "diffrax>=0.5.0",
  "jax>=0.4.25",
  "numpy>=1.24",
]

[project.scripts]
r-elegans-demo = "r_elegans.demo:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
]
data = [
  "openpyxl>=3.1",
]
env = [
  "gymnax>=0.0.8",
  "optax>=0.2",
]
demo = [
  "matplotlib>=3.8",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["r_elegans"]
